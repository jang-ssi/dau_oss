name: Issue Auto Response

# 새 이슈와 PR에 자동으로 안내 댓글을 남기고 분류 대기 라벨을 붙인다.
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 안내 댓글과 라벨
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const isPR = !!context.payload.pull_request;
            const item = context.payload.pull_request ?? context.payload.issue;
            // 봇(Dependabot, 시드 워크플로우 등)이 만든 항목에는 응답하지 않는다.
            if (item.user.type === 'Bot') return;
            const author = item.user.login;
            const base = `https://github.com/${owner}/${repo}`;

            const body = isPR
              ? [
                  `@${author} 님, PR 감사합니다. 🙌`,
                  '',
                  '- 리뷰어가 **1 영업일 이내**에 첫 응답을 드립니다.',
                  `- 리뷰 의견은 \`[MUST]\`/\`[SHOULD]\` 태그로 구분됩니다. [리뷰 가이드](${base}/blob/main/docs/REVIEW_GUIDE.md)를 참고해 주세요.`,
                ].join('\n')
              : [
                  `@${author} 님, 이슈를 등록해 주셔서 감사합니다. 🙌`,
                  '',
                  '- 관리자가 **2 영업일 이내**에 확인하고 라벨을 분류합니다.',
                  `- 사용법 질문이라면 [Discussions Q&A](${base}/discussions/categories/q-a)가 더 빠릅니다.`,
                  `- 직접 고쳐 보고 싶다면 [기여 가이드](${base}/blob/main/CONTRIBUTING.md)를 참고해 주세요.`,
                ].join('\n');

            await github.rest.issues.createComment({ owner, repo, issue_number: item.number, body });

            if (!isPR) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: item.number, labels: ['needs-triage'] });
            }
